# No secrets in this file. Every credential comes from the environment.
# Set the values in 04_orchestration/.env, which docker compose loads into
# each Airflow container. Copy .env.example to get started.
walmart_project:
  outputs:
    dev:
      type: databricks
      catalog: walmart
      schema: dbt_schema
      threads: 1
      # The Databricks SDK wants the scheme, this adapter wants a bare host name.
      # DATABRICKS_HOST keeps the scheme for the SDK, and the filters remove it here.
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') | replace('http://', '') | replace('/', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
  target: dev
